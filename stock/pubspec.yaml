
name: stock_management
description: A stock management application built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Date formatting
  intl: ^0.20.2

  # Unique IDs for products
  uuid: ^4.5.1

  # Charts and stock reports
  fl_chart: ^1.1.1

  # Save user preferences
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
